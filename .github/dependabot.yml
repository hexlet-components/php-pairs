version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    groups:
      github-actions-all:
        patterns: ["*"]

  - package-ecosystem: "composer"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    groups:
      composer-all:
        patterns: ["*"]
