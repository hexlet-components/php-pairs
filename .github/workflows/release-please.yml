name: Release Please

# Шага публикации здесь нет намеренно: packagist забирает версию вебхуком по
# тегу, поэтому достаточно, чтобы release-please тег поставил. Проверено: у всех
# шести библиотек на packagist включён auto-update.
on:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
