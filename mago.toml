version = "1"
php-version = "8.5"

[source]
paths = ["src", "tests"]
includes = ["vendor"]

# Функции и переменные в коде Хекслета пишутся в camelCase, линтер по умолчанию
# требует подчёркивания.
[linter.rules.function-name]
camel = true

# Функции библиотек и их тесты вызываются позиционно, как в уроках курса.
[linter.rules.literal-named-argument]
enabled = false
